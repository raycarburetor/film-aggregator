name: Aggregate All Cinemas (DB)

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      force_prune:
        description: 'Bypass db-prune safety guards (age/max-delete-%) for this run'
        type: boolean
        required: false
        default: false

jobs:
  aggregate:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.55 can't install on.
    runs-on: ubuntu-24.04
    environment:
      name: Production
    permissions:
      contents: read
      actions: write # for the keepalive step below
    env:
      NODE_ENV: production
      PGSSLMODE: no-verify
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PRUNE_FORCE: ${{ inputs.force_prune && '1' || '' }}
    steps:
      # GitHub auto-disables scheduled workflows after 60 days without repo
      # activity (this happened Oct 2026 and the site went empty). Re-enabling
      # via the API on every run resets that timer.
      - name: Keep scheduled workflow enabled
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/aggregate-all-db.yml/enable"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # BFI and Close-Up sit behind Cloudflare, which challenges Azure runner
      # IPs hard and rejects headless Chromium. SCRAPER_HEADED makes those two
      # scrapers (scripts/scraper-browser.mjs) launch headed; xvfb-run gives
      # them a virtual display. Other scrapers are unaffected and stay headless.
      - name: Aggregate all cinemas and sync DB
        env:
          SCRAPER_HEADED: '1'
        run: xvfb-run -a npm run aggregate:all:db
